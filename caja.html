<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        POS Local - Caja
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/estilos.css">

    <link
        rel="stylesheet"
        href="css/layout.css">

    <link
        rel="stylesheet"
        href="css/caja.css">

    <link rel="stylesheet" href="css/navegacion.css">
    <link rel="stylesheet" href="css/pantallasNavegacion.css">
</head>

<body class="app-screen">

    <div class="app-shell">

        <nav
            class="navbar navbar-dark bg-dark app-navbar">

            <div class="container-fluid">

                <a
                    class="navbar-brand"
                    href="pos.html">

                    <i class="bi bi-cash-register"></i>

                    <span id="lblNombreSistema">
                        POS Local
                    </span>

                    <small
                        id="lblNombreNegocio"
                        class="ms-2 text-white-50">
                    </small>
                </a>

                <div class="d-flex gap-2">

                    <a
                        class="btn btn-outline-light btn-sm"
                        href="ventas.html">

                        Ventas
                    </a>

                    <a
                        class="btn btn-outline-light btn-sm"
                        href="pos.html">

                        POS
                    </a>

                </div>

            </div>

        </nav>

        <div
            id="contenedorMensajes"
            class="position-fixed top-0 start-50 translate-middle-x mt-3"
            style="z-index: 2000; width: min(500px, 90%);">
        </div>

        <main
            class="container-fluid app-main caja-main">

            <section class="row g-3">

                <div class="col-md-3">

                    <div class="card sombra text-center">

                        <div class="card-body">

                            <small>
                                Estado
                            </small>

                            <h4 id="lblEstado">
                                Cerrada
                            </h4>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card sombra text-center">

                        <div class="card-body">

                            <small>
                                Monto inicial
                            </small>

                            <h4 id="lblInicial">
                                $ 0
                            </h4>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card sombra text-center">

                        <div class="card-body">

                            <small>
                                Ventas efectivo
                            </small>

                            <h4 id="lblVentasEfectivo">
                                $ 0
                            </h4>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card sombra text-center">

                        <div class="card-body">

                            <small>
                                Efectivo teórico
                            </small>

                            <h4 id="lblTeorico">
                                $ 0
                            </h4>

                        </div>

                    </div>

                </div>

            </section>

            <section class="card sombra">

                <div
                    class="card-body d-flex flex-wrap gap-2">

                    <button
                        id="btnAbrir"
                        type="button"
                        class="btn btn-success">

                        Abrir caja
                    </button>

                    <button
                        id="btnIngreso"
                        type="button"
                        class="btn btn-outline-success"
                        disabled>

                        Ingreso manual
                    </button>

                    <button
                        id="btnEgreso"
                        type="button"
                        class="btn btn-outline-danger"
                        disabled>

                        Egreso manual
                    </button>

                    <button
                        id="btnCerrar"
                        type="button"
                        class="btn btn-danger ms-auto"
                        disabled>

                        Cerrar caja
                    </button>

                </div>

            </section>

            <section class="row g-3 caja-tablas">

                <div class="col-lg-6">

                    <div class="card sombra h-100">

                        <div class="card-header">
                            Ventas por medio de pago
                        </div>

                        <div class="table-responsive">

                            <table class="table mb-0">

                                <thead>

                                    <tr>
                                        <th>Medio</th>
                                        <th class="text-end">
                                            Cant.
                                        </th>
                                        <th class="text-end">
                                            Total
                                        </th>
                                    </tr>

                                </thead>

                                <tbody id="tablaMedios">
                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="card sombra h-100">

                        <div class="card-header">
                            Movimientos manuales
                        </div>

                        <div class="table-responsive">

                            <table class="table mb-0">

                                <thead>

                                    <tr>
                                        <th>Fecha</th>
                                        <th>Tipo</th>
                                        <th>Concepto</th>
                                        <th class="text-end">
                                            Importe
                                        </th>
                                    </tr>

                                </thead>

                                <tbody id="tablaMovimientos">
                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <div
        class="modal fade"
        id="modalApertura"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Abrir caja
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="formApertura">

                        <label
                            for="montoInicial"
                            class="form-label">

                            Monto inicial
                        </label>

                        <input
                            id="montoInicial"
                            type="number"
                            min="0"
                            step="0.01"
                            class="form-control"
                            required>

                        <label
                            for="obsApertura"
                            class="form-label mt-3">

                            Observación
                        </label>

                        <textarea
                            id="obsApertura"
                            class="form-control">
                        </textarea>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar
                    </button>

                    <button
                        id="confirmarApertura"
                        type="button"
                        class="btn btn-success">

                        Abrir
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div
        class="modal fade"
        id="modalMovimiento"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        id="tituloMovimiento"
                        class="modal-title">

                        Movimiento
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="formMovimiento">

                        <input
                            id="tipoMovimiento"
                            type="hidden">

                        <label
                            for="conceptoMovimiento"
                            class="form-label">

                            Concepto
                        </label>

                        <input
                            id="conceptoMovimiento"
                            type="text"
                            class="form-control"
                            required>

                        <label
                            for="importeMovimiento"
                            class="form-label mt-3">

                            Importe
                        </label>

                        <input
                            id="importeMovimiento"
                            type="number"
                            min="0.01"
                            step="0.01"
                            class="form-control"
                            required>

                        <label
                            for="obsMovimiento"
                            class="form-label mt-3">

                            Observación
                        </label>

                        <textarea
                            id="obsMovimiento"
                            class="form-control">
                        </textarea>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar
                    </button>

                    <button
                        id="confirmarMovimiento"
                        type="button"
                        class="btn btn-primary">

                        Registrar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <div
        class="modal fade"
        id="modalCierre"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Cerrar caja
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="formCierre">

                        <label class="form-label">
                            Efectivo teórico
                        </label>

                        <div
                            id="teoricoCierre"
                            class="form-control bg-light">
                        </div>

                        <label
                            for="efectivoContado"
                            class="form-label mt-3">

                            Efectivo contado
                        </label>

                        <input
                            id="efectivoContado"
                            type="number"
                            min="0"
                            step="0.01"
                            class="form-control"
                            required>

                        <label
                            for="obsCierre"
                            class="form-label mt-3">

                            Observación
                        </label>

                        <textarea
                            id="obsCierre"
                            class="form-control">
                        </textarea>

                    </form>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar
                    </button>

                    <button
                        id="confirmarCierre"
                        type="button"
                        class="btn btn-danger">

                        Cerrar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/config.js?v=0.23.0-RC1.1"></script>
    <script src="js/api.js?v=0.23.0-RC1.1"></script><script src="js/seguridad.js?v=0.23.0-RC1.1"></script>
    <script src="js/mensajes.js"></script>
    <script src="js/caja.js?v=0.23.0-RC1.1"></script>

    <script src="js/integracionPantallas.js"></script>
    <script src="js/navegacion.js?v=0.23.0-RC1.1"></script>

</body>

</html>
