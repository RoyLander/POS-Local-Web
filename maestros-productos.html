<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Local - Maestros</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/navegacion.css"><link rel="stylesheet" href="css/modulosProfesionales.css"></head><body class="app-screen"><div class="app-shell"><div id="navegacionPrincipal"></div><header class="module-action-bar"><div class="module-action-title"><i class="bi bi-card-list"></i><div><h1>Maestros de productos</h1><p>Administración de marcas, categorías, colores y talles</p></div></div><button id="btnNuevoMaestro" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo valor</button></header><div id="contenedorMensajes" class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:2000;width:min(600px,90%);"></div><main class="container-fluid app-main"><section class="card sombra"><div class="card-body"><div class="row g-2 mb-3"><div class="col-md-4"><select id="filtroTipo" class="form-select"><option value="">Todos los tipos</option><option>MARCA</option><option>CATEGORIA</option><option>COLOR</option><option>TALLE</option></select></div><div class="col-md-5"><input id="filtroTexto" class="form-control" placeholder="Buscar valor"></div><div class="col-md-3 form-check form-switch pt-2"><input id="mostrarInactivos" class="form-check-input" type="checkbox"><label class="form-check-label" for="mostrarInactivos">Mostrar inactivos</label></div></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Tipo</th><th>Valor</th><th>Orden</th><th>Estado</th><th></th></tr></thead><tbody id="tablaMaestros"></tbody></table></div></div></section></main></div><div class="modal fade" id="modalMaestro" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="tituloModalMaestro">Nuevo valor</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="maestroId" type="hidden"><div class="mb-3"><label class="form-label">Tipo</label><select id="maestroTipo" class="form-select"><option>MARCA</option><option>CATEGORIA</option><option>COLOR</option><option>TALLE</option></select></div><div class="mb-3"><label class="form-label">Valor *</label><input id="maestroValor" class="form-control" maxlength="100"></div><div class="row"><div class="col-6"><label class="form-label">Orden</label><input id="maestroOrden" class="form-control" type="number" min="0" value="0"></div><div class="col-6"><label class="form-label">Estado</label><select id="maestroActivo" class="form-select"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></div></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button id="btnGuardarMaestro" class="btn btn-primary">Guardar</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js?v=0.23.0-RC1.1"></script><script src="js/api.js?v=0.23.0-RC1.1"></script><script src="js/seguridad.js?v=0.23.0-RC1.1"></script><script src="js/mensajes.js"></script><script src="js/navegacion.js?v=0.23.0-RC1.1"></script><script src="js/maestrosProductos.js?v=0.23.0-RC1.1"></script></body></html>
