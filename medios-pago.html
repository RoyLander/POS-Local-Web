<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Local - Medios de pago</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/navegacion.css"><link rel="stylesheet" href="css/modulosProfesionales.css"></head><body class="app-screen"><div class="app-shell"><div id="navegacionPrincipal"></div><header class="module-action-bar"><div class="module-action-title"><i class="bi bi-credit-card"></i><div><h1>Medios de pago</h1><p>ABM y descuentos opcionales por medio de pago</p></div></div><button id="btnNuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo medio</button></header><div id="contenedorMensajes" class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:2000;width:min(600px,90%);"></div><main class="container-fluid app-main"><section class="card sombra"><div class="card-body"><div class="form-check form-switch mb-3"><input id="mostrarInactivos" class="form-check-input" type="checkbox" checked><label class="form-check-label">Mostrar inactivos</label></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Medio de pago</th><th>Descuento</th><th>Orden</th><th>Estado</th><th></th></tr></thead><tbody id="tablaMedios"></tbody></table></div></div></section></main></div><div class="modal fade" id="modalMedio" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 id="tituloModal" class="modal-title">Nuevo medio</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="medioId" type="hidden"><div class="mb-3"><label class="form-label">Nombre *</label><input id="medioNombre" class="form-control" maxlength="80"></div><div class="row"><div class="col-6"><label class="form-label">Descuento %</label><input id="medioDescuento" type="number" min="0" max="100" step="0.01" class="form-control" value="0"><div class="form-text">El cajero decide si lo aplica.</div></div><div class="col-3"><label class="form-label">Orden</label><input id="medioOrden" type="number" min="0" class="form-control" value="0"></div><div class="col-3"><label class="form-label">Estado</label><select id="medioActivo" class="form-select"><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select></div></div></div><div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button id="btnGuardar" class="btn btn-primary">Guardar</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js?v=0.23.0-RC1.1"></script><script src="js/api.js?v=0.23.0-RC1.1"></script><script src="js/seguridad.js?v=0.23.0-RC1.1"></script><script src="js/mensajes.js"></script><script src="js/navegacion.js?v=0.23.0-RC1.1"></script><script src="js/mediosPago.js?v=0.23.0-RC1.1"></script></body></html>
