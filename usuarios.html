<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Local - Usuarios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/navegacion.css"><link rel="stylesheet" href="css/modulosProfesionales.css"></head><body class="app-screen"><div id="navegacionPrincipal"></div><header class="module-action-bar"><div class="module-action-title"><i class="bi bi-people"></i><div><h1>Usuarios y operadores</h1><p>Acceso, roles y estado de operadores</p></div></div><button id="btnNuevo" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo usuario</button></header><main class="container-fluid app-main"><div id="alertaInicial" class="alert alert-warning">Por seguridad, cambiá el PIN inicial del usuario ADMIN.</div><section class="card sombra"><div class="card-body"><div class="form-check form-switch mb-3"><input id="verInactivos" class="form-check-input" type="checkbox"><label class="form-check-label">Mostrar inactivos</label></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Último acceso</th><th>Estado</th><th></th></tr></thead><tbody id="tabla"></tbody></table></div></div></section></main><div class="modal fade" id="modalUsuario"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 id="tituloModal">Usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="idUsuario" type="hidden"><label class="form-label">Usuario *</label><input id="usuario" class="form-control text-uppercase mb-2"><label class="form-label">Nombre *</label><input id="nombre" class="form-control mb-2"><div class="row"><div class="col-6"><label class="form-label">Rol</label><select id="rol" class="form-select"><option>CAJERO</option><option>SUPERVISOR</option><option>ADMIN</option></select></div><div class="col-6"><label class="form-label">Estado</label><select id="activo" class="form-select"><option>ACTIVO</option><option>INACTIVO</option></select></div></div><label class="form-label mt-2">PIN <span class="text-muted">(4 a 8 dígitos)</span></label><input id="pin" type="password" inputmode="numeric" class="form-control"><div class="form-text">En edición, dejar vacío para conservar el PIN.</div></div><div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button id="guardar" class="btn btn-primary">Guardar</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js?v=0.23.0-RC1.1"></script><script src="js/api.js?v=0.23.0-RC1.1"></script><script src="js/seguridad.js?v=0.23.0-RC1.1"></script><script src="js/mensajes.js"></script><script src="js/navegacion.js?v=0.23.0-RC1.1"></script><script src="js/usuarios.js?v=0.23.0-RC1.1"></script></body></html>
