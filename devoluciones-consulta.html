<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Local - Consulta de devoluciones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/navegacion.css"></head><body><div id="navegacionPrincipal"></div><main class="container-fluid py-3"><section class="card"><div class="card-header"><div class="row g-2 align-items-end"><div class="col-md-3"><label class="form-label mb-1">Devolución o venta</label><input id="filtroNumero" class="form-control" placeholder="Número"></div><div class="col-md-4"><label class="form-label mb-1">Producto</label><input id="filtroProducto" class="form-control" placeholder="Descripción o SKU"></div><div class="col-md-3"><label class="form-label mb-1">Fecha de venta</label><input id="filtroFechaVenta" type="date" class="form-control"></div><div class="col-md-2"><button id="buscar" class="btn btn-primary w-100">Buscar</button></div></div></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Devolución</th><th>Venta</th><th>Fecha venta</th><th>Fecha devolución</th><th>Productos</th><th>Operador</th><th>Autorizante</th><th class="text-end">Importe</th><th></th></tr></thead><tbody id="tabla"></tbody></table></div></section></main><div class="modal fade" id="modalDetalleDevolucion" tabindex="-1" aria-labelledby="modalDetalleDevolucionTitulo" aria-hidden="true">
