<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS Local - Devoluciones</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/navegacion.css"><link rel="stylesheet" href="css/devoluciones.css?v=0.26.0"></head><body><div id="navegacionPrincipal"></div><div id="contenedorMensajes" class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:4000;width:min(540px,92%)"></div><main class="container-fluid devoluciones-main"><div class="devoluciones-grid"><section class="card shadow-sm panel-scroll"><div class="card-header d-flex gap-2 align-items-end"><div class="flex-grow-1"><label class="form-label mb-1">Venta original o producto</label><input id="criterioVenta" class="form-control" placeholder="Id, comprobante, descripción o SKU"></div><div style="min-width:170px"><label class="form-label mb-1">Fecha de venta</label><input id="fechaVenta" type="date" class="form-control"></div><button id="btnBuscarVenta" class="btn btn-primary"><i class="bi bi-search"></i> Buscar</button></div><div class="card-body"><div id="resultadosVentas" class="mb-3"></div><div id="datosVenta" class="alert alert-light border">Buscá una venta para comenzar.</div><div class="table-responsive"><table class="table table-sm tabla-dev"><thead><tr><th>Artículo</th><th class="text-end">Vend.</th><th class="text-end">Consumida</th><th class="text-end">Disponible</th><th>Cantidad</th><th>Estado</th><th>Stock</th><th class="text-end">Reconocido</th></tr></thead><tbody id="tablaItems"><tr><td colspan="8" class="text-center text-muted">Sin venta seleccionada.</td></tr></tbody></table></div></div></section><aside class="card shadow-sm panel-scroll"><div class="card-header"><i class="bi bi-arrow-counterclockwise"></i> Resumen de devolución</div><div class="card-body"><label class="form-label">Motivo general</label><select id="motivoGeneral" class="form-select mb-2"><option value="">Seleccionar...</option><option>TALLE_INCORRECTO</option><option>COLOR_INCORRECTO</option><option>DEFECTO</option><option>ERROR_DE_VENTA</option><option>ARREPENTIMIENTO</option><option>OTRO</option></select><label class="form-label">Observaciones</label><textarea id="observaciones" class="form-control mb-3" rows="2"></textarea><div class="d-flex justify-content-between"><span>Subtotal devuelto</span><strong id="subtotalDevuelto">$ 0,00</strong></div><div class="d-flex justify-content-between text-danger"><span>Descuento proporcional</span><strong id="descuentoDevuelto">$ 0,00</strong></div><div class="d-flex justify-content-between border-top mt-2 pt-2 importe-destacado"><span>Importe reconocido</span><span id="importeReconocido">$ 0,00</span></div><hr><div class="d-flex justify-content-between align-items-center mb-2"><strong>Reintegros</strong><button id="btnAgregarReintegro" class="btn btn-sm btn-outline-primary">Agregar</button></div><div id="listaReintegros"></div><div class="d-flex justify-content-between mt-2"><span>Pendiente de distribuir</span><strong id="pendienteReintegro">$ 0,00</strong></div><div class="sticky-resumen mt-3"><button id="btnConfirmarDevolucion" class="btn btn-danger w-100" disabled><i class="bi bi-check2-circle"></i> Confirmar devolución</button></div></div></aside></div></main><div class="modal fade" id="modalHistorialComercial" tabindex="-1" aria-labelledby="tituloHistorialComercial" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="tituloHistorialComercial"><i class="bi bi-clock-history"></i> Historial comercial</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body" id="contenidoHistorialComercial"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div></div></div></div><div id="overlayProceso" class="overlay-proceso d-none"><div class="text-center"><div class="spinner-border text-primary"></div><div id="textoProceso" class="mt-2 fw-semibold">Procesando...</div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script><script src="js/config.js?v=0.26.0"></script><script src="js/api.js?v=0.26.0"></script><script src="js/seguridad.js?v=0.26.0"></script><script src="js/utilidades.js"></script><script src="js/mensajes.js"></script><script src="js/navegacion.js?v=0.26.0"></script><script src="js/devoluciones.js?v=0.26.0"></script></body></html>
